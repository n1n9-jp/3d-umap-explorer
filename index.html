<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D UMAP Explorer</title>
    <style>html,body{background:#07080c;height:100%;margin:0;overflow:hidden}#app{position:fixed;inset:0}#app canvas{width:100%;height:100%;display:block}#hud{z-index:1;color:#b4bccb;pointer-events:none;white-space:pre-wrap;overflow-wrap:anywhere;max-width:calc(100vw - 48px - var(--minimap-reserve,0px));text-shadow:0 0 4px #000;background:#07080cb8;border-radius:6px;padding:6px 10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:fixed;bottom:10px;left:12px}#hud.error{color:#ff8080}#hud .hud-item{white-space:nowrap}#hud .hud-view{word-break:break-all}#cluster-labels{z-index:0;pointer-events:none;position:fixed;inset:0;overflow:hidden}#cluster-labels[hidden]{display:none}.cluster-label{pointer-events:auto;cursor:pointer;white-space:nowrap;border:2px solid var(--c,#fff);color:#fff;opacity:var(--o,1);text-shadow:0 0 3px #000;-webkit-user-select:none;user-select:none;touch-action:manipulation;background:#07080cd6;border-radius:999px;align-items:center;gap:6px;margin:0;padding:3px 11px 3px 8px;font:700 16px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:inline-flex;position:absolute;top:0;left:0;box-shadow:0 0 0 1px #07080c99}.cluster-label.is-terms{padding:3px 10px 3px 7px;font-size:13px;font-weight:600}.cluster-label.is-terms .cluster-label-name{text-overflow:ellipsis;max-width:15em;overflow:hidden}.cluster-label.is-hidden{visibility:hidden;pointer-events:none}.cluster-label:hover{opacity:1;z-index:1;background:#07080cf5}.cluster-label:focus-visible{opacity:1;outline-offset:2px;z-index:1;outline:2px solid #ffc233}.cluster-label-swatch{background:var(--c,#fff);border-radius:50%;flex:none;width:10px;height:10px}#cluster-location{left:12px;bottom:calc(var(--hud-height,96px) + 18px);z-index:1;pointer-events:none;color:#e8ecf4;text-shadow:0 0 4px #000;background:#07080cd1;border-radius:6px;align-items:center;gap:8px;max-width:calc(100vw - 48px);padding:6px 12px;font:600 14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;position:fixed}#cluster-location[hidden]{display:none}#cluster-location[data-kind=nearest]{color:#b4bccb}.cluster-location-swatch{border-radius:50%;flex:none;width:12px;height:12px}#info{z-index:2;color:#d6dce8;background:#07080cf0;border:1px solid #ffc2338c;border-radius:8px;align-items:flex-start;gap:12px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;position:fixed;top:12px;right:12px}#info[hidden],#hover-label[hidden],#info-image[hidden]{display:none}#info-image{image-rendering:pixelated;image-rendering:crisp-edges;border-radius:3px;display:block}#info .info-label{color:#fff;align-items:center;gap:8px;font-size:28px;font-weight:600;line-height:1.1;display:flex}#info[data-kind=text] .info-label{overflow-wrap:anywhere;max-width:18em;font-size:30px}#info-swatch{border-radius:50%;width:12px;height:12px;display:inline-block}#info dl{grid-template-columns:auto auto;gap:2px 10px;margin:8px 0 0;display:grid}#info dt{color:#8a93a6}#info dd{color:#e8ecf4;margin:0}#info .info-hint{color:#8a93a6;margin-top:8px;font-size:11px}#info-close{color:#8a93a6;cursor:pointer;background:0 0;border:0;padding:4px;font:16px/1 sans-serif;position:absolute;top:2px;right:4px}#info-close:hover{color:#fff}#info-close:focus-visible{outline-offset:1px;color:#fff;outline:2px solid #ffc233}.sr-only{clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;width:1px;height:1px;margin:-1px;padding:0;position:absolute;overflow:hidden}#minimap{z-index:1;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed}#minimap[hidden]{display:none}#minimap:focus{outline:none}#minimap:focus-visible{outline-offset:3px;outline:2px solid #ffc233}#minimap svg{display:block;overflow:visible}#minimap .mm-border{fill:none;stroke:#b4bccb8c;stroke-width:1px}#minimap.outside .mm-border{stroke:#ffffffe6;stroke-dasharray:4 3}#minimap .mm-gauge-bg{fill:#1a2131ed;stroke:#b4bccb8c;stroke-width:1px}#minimap .mm-hist rect{fill:#b4bccb52}#minimap .mm-range{stroke:#b4bccbb3;stroke-width:1px}#minimap .mm-gauge-label{fill:#8a93a6;text-anchor:middle;pointer-events:none;font:9px/1 sans-serif}#minimap.outside .mm-fan{stroke-dasharray:3 2}#minimap .mm-outside-text{fill:#fff;paint-order:stroke;stroke:#07080c;stroke-width:3px;pointer-events:none;font:600 10px/1 sans-serif}#dataset-switcher{z-index:2;color:#b4bccb;background:#07080cd1;border-radius:6px;flex-wrap:wrap;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:5px 10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;position:fixed;top:10px;left:12px}#dataset-switcher[hidden]{display:none}#dataset-select{font:inherit;color:#e8ecf4;background:#141a26;border:1px solid #b4bccb73;border-radius:4px;padding:2px 4px}#dataset-select:focus-visible{outline-offset:1px;outline:2px solid #ffc233}#dataset-select:disabled{opacity:.6}#dataset-status{color:#b4bccb}#dataset-status[hidden]{display:none}#dataset-status.error{color:#ff8080}#embedding-status{color:#8a93a6}#embedding-status.computed{color:#ffc233}#umap-open{font:inherit;color:#e8ecf4;cursor:pointer;background:#141a26;border:1px solid #b4bccb73;border-radius:4px;padding:1px 6px}#umap-open:focus-visible{outline-offset:1px;outline:2px solid #ffc233}#umap-open[aria-expanded=true]{border-color:#ffc233}#umap-open:disabled{opacity:.6;cursor:default}#umap-panel{z-index:2;box-sizing:border-box;color:#d6dce8;background:#07080cf0;border:1px solid #b4bccb73;border-radius:8px;width:300px;max-width:calc(100vw - 48px);max-height:calc(100vh - 70px);padding:10px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:fixed;top:50px;left:12px;overflow:auto}#umap-panel[hidden]{display:none}#umap-panel:focus{outline:none}#umap-panel:focus-visible{outline-offset:2px;outline:2px solid #ffc233}#umap-panel h2{color:#fff;margin:0 24px 6px 0;font-size:13px}#umap-panel h3{color:#b4bccb;margin:8px 0 2px;font-size:12px;font-weight:600}#umap-current{color:#e8ecf4;margin:0 0 8px}#umap-form{grid-template-columns:auto 1fr;align-items:center;gap:4px 8px;display:grid}#umap-form label{color:#b4bccb}#umap-form input[type=number]{font:inherit;color:#e8ecf4;box-sizing:border-box;background:#141a26;border:1px solid #b4bccb73;border-radius:4px;width:100%;padding:2px 4px}#umap-form input[aria-invalid=true]{border-color:#ff8080}#umap-form .umap-check{grid-column:1/-1;align-items:center;gap:6px;display:flex}#umap-form .umap-buttons{flex-wrap:wrap;grid-column:1/-1;gap:6px;margin-top:4px;display:flex}#umap-panel button{font:inherit;color:#e8ecf4;cursor:pointer;background:#1d2536;border:1px solid #b4bccb8c;border-radius:4px;padding:2px 8px}#umap-panel button:disabled{opacity:.5;cursor:default}#umap-panel button[hidden]{display:none}#umap-panel button:focus-visible,#umap-panel input:focus-visible{outline-offset:1px;outline:2px solid #ffc233}#umap-run{border-color:#ffc233!important}#umap-close{position:absolute;top:2px;right:4px;color:#8a93a6!important;background:0 0!important;border:0!important;padding:4px!important;font:16px/1 sans-serif!important}#umap-progress{margin-top:8px}#umap-progress[hidden]{display:none}#umap-progress progress{accent-color:#ffc233;width:100%;height:8px;display:block}#umap-message{color:#b4bccb;margin:6px 0 0}#umap-message[hidden]{display:none}#umap-message.error{color:#ff8080}#umap-cache[hidden]{display:none}#umap-cache ul{flex-direction:column;gap:2px;margin:0;padding:0;list-style:none;display:flex}#umap-cache button{text-align:left;width:100%}#umap-cache button[aria-current=true]{opacity:1;border-color:#ffc233}#umap-panel .umap-note{color:#8a93a6;margin:8px 0 0;font-size:11px}#hover-label{z-index:3;pointer-events:none;color:#fff;background:#07080cd9;border:1px solid #f2f5fa;border-radius:4px;padding:1px 7px;font:600 13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:fixed;top:0;left:0}</style>
    <script type="module" crossorigin src="./assets/index-CfRPU7hD.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">読み込み中…</div>
    <div id="dataset-switcher" hidden>
      <label for="dataset-select">データ</label>
      <select id="dataset-select"></select>
      <span id="dataset-status" role="status" aria-live="polite" hidden></span>
      <span id="embedding-status">埋め込み: 事前計算</span>
      <button id="umap-open" type="button" aria-controls="umap-panel" aria-expanded="false" title="UMAP の再計算（U）" disabled>UMAP 再計算 (U)</button>
    </div>
    <section id="umap-panel" role="region" aria-labelledby="umap-heading" tabindex="-1" hidden>
      <h2 id="umap-heading">UMAP の再計算</h2>
      <p id="umap-current"></p>
      <form id="umap-form" novalidate>
        <label for="umap-nn">近傍数</label>
        <input id="umap-nn" type="number" inputmode="numeric" step="1" />
        <label for="umap-md">min_dist</label>
        <input id="umap-md" type="number" inputmode="decimal" />
        <label for="umap-seed">乱数の種</label>
        <input id="umap-seed" type="number" inputmode="numeric" step="1" />
        <label class="umap-check"><input id="umap-preview" type="checkbox" /> 計算の途中を表示する</label>
        <div class="umap-buttons">
          <button id="umap-run" type="submit">計算</button>
          <button id="umap-cancel" type="button" hidden>中断</button>
          <button id="umap-revert" type="button">事前計算に戻す</button>
        </div>
      </form>
      <div id="umap-progress" hidden>
        <progress id="umap-progress-bar" max="200" value="0"></progress>
        <span id="umap-progress-text" role="status" aria-live="polite"></span>
      </div>
      <p id="umap-message" role="status" aria-live="polite" hidden></p>
      <div id="umap-cache" hidden>
        <h3>保持している結果</h3>
        <ul id="umap-cache-list"></ul>
      </div>
      <p class="umap-note">点の配置は、近傍数・min_dist・乱数の種で変わります。塊の中の並びは元のデータの近さを反映しますが、遠く離れた塊どうしの位置関係や距離は当てにしないでください。</p>
      <button id="umap-close" type="button" aria-label="UMAP の再計算のパネルを閉じる"><span aria-hidden="true">×</span></button>
    </section>
    <div id="cluster-location" hidden></div>
    <div id="info-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <section id="info" role="region" aria-labelledby="info-heading" hidden>
      <h2 id="info-heading" class="sr-only">選択中の点</h2>
      <canvas id="info-image" width="112" height="112" role="img" aria-label="手書きの数字の画像"></canvas>
      <div>
        <div class="info-label"><span id="info-swatch" aria-hidden="true"></span><span id="info-label"></span></div>
        <dl>
          <dt>番号</dt><dd id="info-index"></dd>
          <dt>クラスタ</dt><dd id="info-cluster"></dd>
        </dl>
        <div class="info-hint">ダブルクリックで近づく<br />Esc で選択を解除</div>
      </div>
      <button id="info-close" type="button" aria-label="選択を解除"><span aria-hidden="true">×</span></button>
    </section>
    <div id="hover-label" aria-hidden="true" hidden></div>
    <!-- 目印は Tab の順で情報パネルのあと。見た目の重なりは z-index（HUD・情報パネルより下） -->
    <div id="cluster-labels" role="group" aria-label="クラスタの目印" hidden></div>
  </body>
</html>
