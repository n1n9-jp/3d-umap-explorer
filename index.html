<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D UMAP Explorer</title>
    <style>html,body{background:#07080c;height:100%;margin:0;overflow:hidden}#app{position:fixed;inset:0}#app canvas{width:100%;height:100%;display:block}#hud{z-index:1;color:#b4bccb;pointer-events:none;white-space:pre-wrap;text-shadow:0 0 4px #000;background:#07080cb8;border-radius:6px;max-width:calc(100vw - 48px);padding:6px 10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:fixed;bottom:10px;left:12px}#hud.error{color:#ff8080}#info{z-index:2;color:#d6dce8;background:#07080cf0;border:1px solid #ffc2338c;border-radius:8px;align-items:flex-start;gap:12px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;position:fixed;top:12px;right:12px}#info[hidden],#hover-label[hidden]{display:none}#info-image{image-rendering:pixelated;image-rendering:crisp-edges;border-radius:3px;display:block}#info .info-label{color:#fff;align-items:center;gap:8px;font-size:28px;font-weight:600;line-height:1.1;display:flex}#info-swatch{border-radius:50%;width:12px;height:12px;display:inline-block}#info dl{grid-template-columns:auto auto;gap:2px 10px;margin:8px 0 0;display:grid}#info dt{color:#8a93a6}#info dd{color:#e8ecf4;margin:0}#info .info-hint{color:#8a93a6;margin-top:8px;font-size:11px}#info-close{color:#8a93a6;cursor:pointer;background:0 0;border:0;padding:4px;font:16px/1 sans-serif;position:absolute;top:2px;right:4px}#info-close:hover{color:#fff}#info-close:focus-visible{outline-offset:1px;color:#fff;outline:2px solid #ffc233}.sr-only{clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;width:1px;height:1px;margin:-1px;padding:0;position:absolute;overflow:hidden}#hover-label{z-index:3;pointer-events:none;color:#fff;background:#07080cd9;border:1px solid #f2f5fa;border-radius:4px;padding:1px 7px;font:600 13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:fixed;top:0;left:0}</style>
    <script type="module" crossorigin src="./assets/index-B9DVaHFf.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">読み込み中…</div>
    <div id="info-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <section id="info" role="region" aria-labelledby="info-heading" hidden>
      <h2 id="info-heading" class="sr-only">選択中の点</h2>
      <canvas id="info-image" width="112" height="112" role="img" aria-label="手書きの数字の画像"></canvas>
      <div>
        <div class="info-label"><span id="info-swatch" aria-hidden="true"></span><span id="info-label"></span></div>
        <dl>
          <dt>番号</dt><dd id="info-index"></dd>
          <dt>クラスタ</dt><dd id="info-cluster"></dd>
        </dl>
        <div class="info-hint">ダブルクリックで近づく<br />Esc で選択を解除</div>
      </div>
      <button id="info-close" type="button" aria-label="選択を解除"><span aria-hidden="true">×</span></button>
    </section>
    <div id="hover-label" aria-hidden="true" hidden></div>
  </body>
</html>
