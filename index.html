<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D UMAP Explorer</title>
    <style>html,body{background:#07080c;height:100%;margin:0;overflow:hidden}#app{position:fixed;inset:0}#app canvas{width:100%;height:100%;display:block}#hud{z-index:1;color:#b4bccb;pointer-events:none;white-space:pre-wrap;max-width:calc(100vw - 48px - var(--minimap-reserve,0px));text-shadow:0 0 4px #000;background:#07080cb8;border-radius:6px;padding:6px 10px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:fixed;bottom:10px;left:12px}#hud.error{color:#ff8080}#cluster-labels{z-index:0;pointer-events:none;position:fixed;inset:0;overflow:hidden}#cluster-labels[hidden]{display:none}.cluster-label{pointer-events:auto;cursor:pointer;white-space:nowrap;border:2px solid var(--c,#fff);color:#fff;opacity:var(--o,1);text-shadow:0 0 3px #000;-webkit-user-select:none;user-select:none;touch-action:manipulation;background:#07080cd6;border-radius:999px;align-items:center;gap:6px;margin:0;padding:3px 11px 3px 8px;font:700 16px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:inline-flex;position:absolute;top:0;left:0;box-shadow:0 0 0 1px #07080c99}.cluster-label.is-hidden{visibility:hidden;pointer-events:none}.cluster-label:hover{opacity:1;z-index:1;background:#07080cf5}.cluster-label:focus-visible{opacity:1;outline-offset:2px;z-index:1;outline:2px solid #ffc233}.cluster-label-swatch{background:var(--c,#fff);border-radius:50%;flex:none;width:10px;height:10px}#cluster-location{left:12px;bottom:calc(var(--hud-height,96px) + 18px);z-index:1;pointer-events:none;color:#e8ecf4;text-shadow:0 0 4px #000;background:#07080cd1;border-radius:6px;align-items:center;gap:8px;max-width:calc(100vw - 48px);padding:6px 12px;font:600 14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;position:fixed}#cluster-location[hidden]{display:none}#cluster-location[data-kind=nearest]{color:#b4bccb}.cluster-location-swatch{border-radius:50%;flex:none;width:12px;height:12px}#info{z-index:2;color:#d6dce8;background:#07080cf0;border:1px solid #ffc2338c;border-radius:8px;align-items:flex-start;gap:12px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;position:fixed;top:12px;right:12px}#info[hidden],#hover-label[hidden]{display:none}#info-image{image-rendering:pixelated;image-rendering:crisp-edges;border-radius:3px;display:block}#info .info-label{color:#fff;align-items:center;gap:8px;font-size:28px;font-weight:600;line-height:1.1;display:flex}#info-swatch{border-radius:50%;width:12px;height:12px;display:inline-block}#info dl{grid-template-columns:auto auto;gap:2px 10px;margin:8px 0 0;display:grid}#info dt{color:#8a93a6}#info dd{color:#e8ecf4;margin:0}#info .info-hint{color:#8a93a6;margin-top:8px;font-size:11px}#info-close{color:#8a93a6;cursor:pointer;background:0 0;border:0;padding:4px;font:16px/1 sans-serif;position:absolute;top:2px;right:4px}#info-close:hover{color:#fff}#info-close:focus-visible{outline-offset:1px;color:#fff;outline:2px solid #ffc233}.sr-only{clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;width:1px;height:1px;margin:-1px;padding:0;position:absolute;overflow:hidden}#minimap{z-index:1;cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed}#minimap[hidden]{display:none}#minimap svg{display:block;overflow:visible}#minimap .mm-border{fill:none;stroke:#b4bccb8c;stroke-width:1px}#minimap.outside .mm-border{stroke:#ffffffe6;stroke-dasharray:4 3}#minimap .mm-gauge-bg{fill:#1a2131ed;stroke:#b4bccb8c;stroke-width:1px}#minimap .mm-hist rect{fill:#b4bccb52}#minimap .mm-range{stroke:#b4bccbb3;stroke-width:1px}#minimap .mm-gauge-label{fill:#8a93a6;text-anchor:middle;pointer-events:none;font:9px/1 sans-serif}#minimap.outside .mm-fan{stroke-dasharray:3 2}#minimap .mm-outside-text{fill:#fff;paint-order:stroke;stroke:#07080c;stroke-width:3px;pointer-events:none;font:600 10px/1 sans-serif}#hover-label{z-index:3;pointer-events:none;color:#fff;background:#07080cd9;border:1px solid #f2f5fa;border-radius:4px;padding:1px 7px;font:600 13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;position:fixed;top:0;left:0}</style>
    <script type="module" crossorigin src="./assets/index-d-g-NQtI.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">読み込み中…</div>
    <div id="cluster-location" hidden></div>
    <div id="info-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <section id="info" role="region" aria-labelledby="info-heading" hidden>
      <h2 id="info-heading" class="sr-only">選択中の点</h2>
      <canvas id="info-image" width="112" height="112" role="img" aria-label="手書きの数字の画像"></canvas>
      <div>
        <div class="info-label"><span id="info-swatch" aria-hidden="true"></span><span id="info-label"></span></div>
        <dl>
          <dt>番号</dt><dd id="info-index"></dd>
          <dt>クラスタ</dt><dd id="info-cluster"></dd>
        </dl>
        <div class="info-hint">ダブルクリックで近づく<br />Esc で選択を解除</div>
      </div>
      <button id="info-close" type="button" aria-label="選択を解除"><span aria-hidden="true">×</span></button>
    </section>
    <div id="hover-label" aria-hidden="true" hidden></div>
    <!-- 目印は Tab の順で情報パネルのあと。見た目の重なりは z-index（HUD・情報パネルより下） -->
    <div id="cluster-labels" role="group" aria-label="クラスタの目印" hidden></div>
  </body>
</html>
