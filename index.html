<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D UMAP Explorer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 12px; bottom: 10px; z-index: 1;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #b4bccb; pointer-events: none; white-space: pre-wrap; overflow-wrap: anywhere;
        max-width: calc(100vw - 48px - var(--minimap-reserve, 0px)); padding: 6px 10px; border-radius: 6px;
        background: rgba(7, 8, 12, 0.72);
        text-shadow: 0 0 4px #000;
      }
      #hud.error { color: #ff8080; }
      /* 操作説明の 1 項目。幅が足りないときは、項目の途中ではなく項目の切れ目で折り返す */
      #hud .hud-item { white-space: nowrap; }
      #hud .hud-view { word-break: break-all; }
      #cluster-labels { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
      #cluster-labels[hidden] { display: none; }
      .cluster-label {
        position: absolute; left: 0; top: 0; margin: 0; pointer-events: auto; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        padding: 3px 11px 3px 8px; border-radius: 999px; border: 2px solid var(--c, #fff);
        background: rgba(7, 8, 12, 0.84); color: #fff; opacity: var(--o, 1);
        font: 700 16px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-shadow: 0 0 3px #000; user-select: none; -webkit-user-select: none; touch-action: manipulation;
        box-shadow: 0 0 0 1px rgba(7, 8, 12, 0.6);
      }
      /* 代表の単語を並べた長い名前。小さめの字にし、最大幅を超える分は省略する（全体は title と aria-label） */
      .cluster-label.is-terms { font-size: 13px; font-weight: 600; padding: 3px 10px 3px 7px; }
      .cluster-label.is-terms .cluster-label-name { max-width: 15em; overflow: hidden; text-overflow: ellipsis; }
      .cluster-label.is-hidden { visibility: hidden; pointer-events: none; }
      .cluster-label:hover { opacity: 1; background: rgba(7, 8, 12, 0.96); z-index: 1; }
      .cluster-label:focus-visible { opacity: 1; outline: 2px solid #ffc233; outline-offset: 2px; z-index: 1; }
      .cluster-label-swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #fff); flex: none; }
      #cluster-location {
        position: fixed; left: 12px; bottom: calc(var(--hud-height, 96px) + 18px); z-index: 1;
        display: flex; align-items: center; gap: 8px; pointer-events: none;
        max-width: calc(100vw - 48px); padding: 6px 12px; border-radius: 6px;
        background: rgba(7, 8, 12, 0.82); color: #e8ecf4;
        font: 600 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        text-shadow: 0 0 4px #000;
      }
      #cluster-location[hidden] { display: none; }
      #cluster-location[data-kind="nearest"] { color: #b4bccb; }
      .cluster-location-swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
      #info {
        position: relative;
        padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255, 194, 51, 0.55);
        background: rgba(7, 8, 12, 0.94); color: #d6dce8;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #info[hidden], #hover-label[hidden] { display: none; }
      #info-image[hidden] { display: none; }
      #info-image { image-rendering: pixelated; image-rendering: crisp-edges; display: block; border-radius: 3px; }
      #info .info-label { font-size: 28px; line-height: 1.1; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
      /* 単語のデータセットでは、画像の代わりに単語を大きく出す */
      #info[data-kind="text"] .info-label { font-size: 30px; max-width: 18em; overflow-wrap: anywhere; }
      #info-swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
      #info dl { margin: 8px 0 0; display: grid; grid-template-columns: auto auto; gap: 2px 10px; }
      #info dt { color: #8a93a6; }
      #info dd { margin: 0; color: #e8ecf4; }
      #info .info-hint { margin-top: 8px; color: #8a93a6; font-size: 11px; }
      #info-close {
        position: absolute; right: 4px; top: 2px; border: 0; background: none; color: #8a93a6;
        font: 16px/1 sans-serif; cursor: pointer; padding: 4px;
      }
      #info-close:hover { color: #fff; }
      #info-close:focus-visible { outline: 2px solid #ffc233; outline-offset: 1px; color: #fff; }
      /* 元のデータで近い点の一覧（src/neighbors/） */
      /* 縦の短い画面でも、パネル全体を右上の列（#top-right）の中に収める。一覧がはみ出すときは、一覧の部分だけがスクロールする。
         一覧を最小の高さにしても収まらないほど短いときだけ、パネル全体をスクロールする。
         パネルの幅は、上の段（画像と文字）で決まる（一覧は contain: inline-size で幅に影響せず、その幅で折り返す） */
      #info {
        display: flex; flex-direction: column; align-items: stretch; gap: 8px;
        box-sizing: border-box; max-height: 100%; overflow-y: auto; scrollbar-width: thin;
      }
      #info .info-main { display: flex; gap: 12px; align-items: flex-start; flex: none; }
      #info-neighbors {
        contain: inline-size; min-width: min(320px, calc(100vw - 52px)); flex: 0 1 auto; min-height: 140px; /* 見出し・要約・一覧の最小の高さ・一言が重ならない下限 */ display: flex; flex-direction: column;
        border-top: 1px solid rgba(79, 216, 255, 0.35); padding-top: 6px; font-size: 11px; line-height: 1.4;
      }
      #info-neighbors[hidden] { display: none; }
      #info-neighbors > * { flex: none; }
      #info-neighbors .nb-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
      #info-neighbors h3 { margin: 0; font-size: 11px; font-weight: 600; color: #4fd8ff; }
      #info-neighbors .nb-legend { order: 2; flex-basis: 100%; color: #8a93a6; }
      #info-neighbors-summary { margin: 2px 0 4px; color: #e8ecf4; }
      #info-neighbors-hint { margin: 3px 0 0; color: #8a93a6; }
      #info-neighbors-hint:empty { display: none; }
      #info-neighbors-list {
        list-style: none; margin: 0; padding: 2px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 3px;
        flex: 0 1 auto; min-height: 4.2em; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
      }
      #info-neighbors-list:empty { display: none; }
      #info-neighbors .nb-item {
        position: relative; display: inline-flex; align-items: center; gap: 3px; margin: 0; cursor: pointer;
        padding: 0 5px 0 3px; border-radius: 3px; border: 1px solid rgba(79, 216, 255, 0.3);
        background: rgba(20, 24, 34, 0.9); color: #e8ecf4; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #info-neighbors .nb-item:hover, #info-neighbors .nb-item:focus-visible { border-color: #4fd8ff; background: rgba(79, 216, 255, 0.16); outline: none; }
      #info-neighbors .nb-item:focus-visible { box-shadow: 0 0 0 1px #4fd8ff; }
      #info-neighbors .nb-item[data-in-map="0"] { border-style: dashed; }
      #info-neighbors .nb-mark { color: #4fd8ff; font-size: 9px; }
      #info-neighbors .nb-swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      #info-neighbors-list:has(.nb-thumb) { gap: 2px; }
      #info-neighbors .nb-thumb { padding: 0; border-width: 1px 1px 3px; border-style: solid; border-radius: 2px; }
      #info-neighbors .nb-thumb[data-in-map="0"] { border-top-style: dashed; border-left-style: dashed; border-right-style: dashed; }
      #info-neighbors .nb-thumb canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #info-neighbors .nb-thumb .nb-mark { position: absolute; right: 0; top: -2px; font-size: 10px; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 1px #000; }
      #info-back {
        flex: none; align-self: center; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(20, 24, 34, 0.9); color: #e8ecf4; border-radius: 3px;
        padding: 0 6px; cursor: pointer; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #info-back { order: 1; margin-left: auto; }
      #info-back[hidden] { display: none; }
      #info-back:hover, #info-back:focus-visible { border-color: #fff; outline: none; }
      #neighbor-edges { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
      .nb-edge { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .nb-edge[hidden] { display: none; }
      .nb-edge-arrow {
        position: absolute; left: -9px; top: -9px; width: 18px; height: 18px;
      }
      .nb-edge-arrow::before {
        content: ''; position: absolute; left: 15px; top: 3px; border-style: solid; border-width: 6px 0 6px 9px;
        border-color: transparent transparent transparent var(--c, #4fd8ff); filter: drop-shadow(0 0 1px #000);
      }
      .nb-edge-rank {
        position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%;
        border: 1.5px solid var(--c, #4fd8ff); background: rgba(7, 8, 12, 0.85); color: #e8ecf4; box-sizing: border-box;
        font: 600 9px/13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: center;
      }
      .nb-edge.is-behind .nb-edge-rank { border-style: dashed; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
        overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
      }
      /* ミニマップ（src/minimap/）。点群は WebGL で同じ canvas の右下へ描き、枠・印・目盛りをこの SVG で重ねる */
      #minimap { position: fixed; z-index: 1; cursor: crosshair; touch-action: none; user-select: none; }
      #minimap[hidden] { display: none; }
      #minimap:focus { outline: none; }
      #minimap:focus-visible { outline: 2px solid #ffc233; outline-offset: 3px; }
      #minimap svg { display: block; overflow: visible; }
      #minimap .mm-border { fill: none; stroke: rgba(180, 188, 203, 0.55); stroke-width: 1; }
      #minimap.outside .mm-border { stroke: rgba(255, 255, 255, 0.9); stroke-dasharray: 4 3; }
      #minimap .mm-gauge-bg { fill: rgba(26, 33, 49, 0.93); stroke: rgba(180, 188, 203, 0.55); stroke-width: 1; }
      #minimap .mm-hist rect { fill: rgba(180, 188, 203, 0.32); }
      #minimap .mm-range { stroke: rgba(180, 188, 203, 0.7); stroke-width: 1; }
      #minimap .mm-gauge-label { fill: #8a93a6; font: 9px/1 sans-serif; text-anchor: middle; pointer-events: none; }
      #minimap.outside .mm-fan { stroke-dasharray: 3 2; }
      #minimap .mm-outside-text { fill: #fff; font: 600 10px/1 sans-serif; paint-order: stroke; stroke: #07080c; stroke-width: 3px; pointer-events: none; }
      /* データセットの選択欄（右上の列の先頭） */
      #dataset-switcher {
        position: relative; flex: none; box-sizing: border-box;
        display: flex; align-items: center; justify-content: flex-end; gap: 4px 8px; flex-wrap: wrap; max-width: 100%;
        padding: 5px 10px; border-radius: 6px; background: rgba(7, 8, 12, 0.82);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #b4bccb;
      }
      #dataset-switcher[hidden] { display: none; }
      #dataset-select {
        font: inherit; color: #e8ecf4; background: #141a26; border: 1px solid rgba(180, 188, 203, 0.45);
        border-radius: 4px; padding: 2px 4px;
      }
      #dataset-select:focus-visible { outline: 2px solid #ffc233; outline-offset: 1px; }
      #dataset-select:disabled { opacity: 0.6; }
      #dataset-status { color: #b4bccb; }
      #dataset-status[hidden] { display: none; }
      #dataset-status.error { color: #ff8080; }
      /* 表示中の埋め込み（事前計算か、ブラウザで計算したものか）と、UMAP の再計算のパネルを開くボタン（選択欄の横） */
      #embedding-status { color: #8a93a6; }
      #embedding-status.computed { color: #ffc233; }
      #umap-open {
        font: inherit; color: #e8ecf4; background: #141a26; border: 1px solid rgba(180, 188, 203, 0.45);
        border-radius: 4px; padding: 1px 6px; cursor: pointer;
      }
      #umap-open:focus-visible { outline: 2px solid #ffc233; outline-offset: 1px; }
      #umap-open[aria-expanded="true"] { border-color: #ffc233; }
      #umap-open:disabled { opacity: 0.6; cursor: default; }
      /* UMAP の再計算のパネル（右上の列、選択欄の下）。src/app/umapPanel.ts */
      #umap-panel {
        position: relative; width: 300px; max-width: 100%; flex: none;
        max-height: 100%; overflow: auto; box-sizing: border-box; scrollbar-width: thin;
        padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(180, 188, 203, 0.45);
        background: rgba(7, 8, 12, 0.94); color: #d6dce8;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #umap-panel[hidden] { display: none; }
      #umap-panel:focus { outline: none; }
      #umap-panel:focus-visible { outline: 2px solid #ffc233; outline-offset: 2px; }
      #umap-panel h2 { margin: 0 24px 6px 0; font-size: 13px; color: #fff; }
      #umap-panel h3 { margin: 8px 0 2px; font-size: 12px; color: #b4bccb; font-weight: 600; }
      #umap-current { margin: 0 0 8px; color: #e8ecf4; }
      #umap-form { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
      #umap-form label { color: #b4bccb; }
      #umap-form input[type="number"] {
        font: inherit; color: #e8ecf4; background: #141a26; border: 1px solid rgba(180, 188, 203, 0.45);
        border-radius: 4px; padding: 2px 4px; width: 100%; box-sizing: border-box;
      }
      #umap-form input[aria-invalid="true"] { border-color: #ff8080; }
      #umap-form .umap-check { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
      #umap-form .umap-buttons { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
      #umap-panel button {
        font: inherit; color: #e8ecf4; background: #1d2536; border: 1px solid rgba(180, 188, 203, 0.55);
        border-radius: 4px; padding: 2px 8px; cursor: pointer;
      }
      #umap-panel button:disabled { opacity: 0.5; cursor: default; }
      #umap-panel button[hidden] { display: none; }
      #umap-panel button:focus-visible, #umap-panel input:focus-visible { outline: 2px solid #ffc233; outline-offset: 1px; }
      #umap-run { border-color: #ffc233 !important; }
      #umap-close { position: absolute; right: 4px; top: 2px; border: 0 !important; background: none !important; color: #8a93a6 !important; font: 16px/1 sans-serif !important; padding: 4px !important; }
      #umap-progress { margin-top: 8px; }
      #umap-progress[hidden] { display: none; }
      #umap-progress progress { width: 100%; height: 8px; display: block; accent-color: #ffc233; }
      #umap-message { margin: 6px 0 0; color: #b4bccb; }
      #umap-message[hidden] { display: none; }
      #umap-message.error { color: #ff8080; }
      #umap-cache[hidden] { display: none; }
      #umap-cache ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
      #umap-cache button { width: 100%; text-align: left; }
      #umap-cache button[aria-current="true"] { border-color: #ffc233; opacity: 1; }
      #umap-panel .umap-note { margin: 8px 0 0; color: #8a93a6; font-size: 11px; }
      /* ---- 画面の上部（src/app/topLayout.ts）。左上に作品タイトルとカメラのモード、右上に選択欄・UMAP のパネル・情報パネル ----
         #top-bar の高さは、右上の列が下の UI（HUD・現在地・ミニマップ）に重ならないように、毎フレーム決め直す（--top-bar-height） */
      #top-bar {
        position: fixed; left: 12px; right: 12px; top: 10px; z-index: 2;
        height: var(--top-bar-height, calc(100vh - 20px)); box-sizing: border-box;
        display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 8px 12px;
        align-items: start; pointer-events: none;
      }
      #top-right {
        grid-column: 2; height: 100%; min-height: 0; min-width: 0;
        display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none;
      }
      #top-panels {
        flex: 0 1 auto; min-height: 0; max-width: 100%; display: flex; flex-direction: row; align-items: flex-start; justify-content: flex-end;
        gap: 8px; pointer-events: none;
      }
      #top-right > *, #top-panels > * { pointer-events: auto; }
      /* 横に並べる余裕のない画面では、UMAP のパネルと情報パネルを縦に並べ、それぞれの中でスクロールする */
      @media (max-width: 1179px) {
        #top-panels { flex-direction: column; align-items: flex-end; overflow-y: auto; scrollbar-width: thin; }
        #top-panels > #umap-panel, #top-panels > #info { flex: 0 1 auto; max-height: none; }
        #top-panels > #umap-panel { min-height: min(120px, 100%); }
        #top-panels > #info { min-height: min(150px, 100%); }
      }
      /* 幅の狭い画面では、タイトルとモードの下に右上の列を置く */
      @media (max-width: 719px) {
        #top-bar { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
        #title-mode { grid-row: 1; justify-self: start; }
        #top-right { grid-column: 1; grid-row: 2; }
        /* 選択欄の行を 2 行に詰める（選択欄と再計算のボタン／埋め込みの状態）。「データ」の文字は読み上げにだけ残す */
        #dataset-switcher > label[for="dataset-select"] {
          position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
          overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
        }
        #dataset-select { min-width: 0; max-width: calc(100% - 130px); }
        #embedding-status { order: 3; flex-basis: 100%; text-align: right; font-size: 11px; line-height: 1.35; }
        #dataset-status { order: 4; flex-basis: 100%; text-align: right; }
        #top-panels > #umap-panel { min-height: min(92px, 100%); }
        #top-panels > #info { min-height: min(106px, 100%); }
      }
      #title-mode {
        grid-column: 1; grid-row: 1; pointer-events: auto; max-width: 100%; box-sizing: border-box;
        padding: 6px 10px 7px; border-radius: 6px; background: rgba(7, 8, 12, 0.82);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #b4bccb;
        text-shadow: 0 0 4px #000;
      }
      #app-title { margin: 0 0 5px; font-size: 15px; line-height: 1.2; font-weight: 700; color: #f2f5fa; letter-spacing: 0.02em; white-space: nowrap; }
      #title-mode .mode-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      #mode-switch { display: inline-flex; border: 1px solid rgba(180, 188, 203, 0.35); border-radius: 5px; overflow: hidden; }
      #mode-switch .mode-option {
        display: flex; flex-direction: column; align-items: flex-start; gap: 1px; margin: 0; cursor: pointer;
        padding: 3px 9px 2px; border: 0; border-bottom: 2px solid transparent; border-radius: 0;
        background: transparent; color: #7d8598; text-align: left;
        font: inherit; transition: color 0.25s ease, background-color 0.25s ease, border-color 0.25s ease;
      }
      #mode-switch .mode-option + .mode-option { border-left: 1px solid rgba(180, 188, 203, 0.35); }
      #mode-switch .mode-option:hover { color: #c9d0dd; background: rgba(255, 255, 255, 0.05); }
      #mode-switch .mode-option[aria-checked="true"] { color: #ffc233; background: rgba(255, 194, 51, 0.13); border-bottom-color: #ffc233; cursor: default; }
      #mode-switch .mode-option:focus { outline: none; }
      #mode-switch .mode-option:focus-visible { outline: 2px solid #ffc233; outline-offset: -2px; }
      #mode-switch .mode-name { font-size: 14px; font-weight: 700; line-height: 1.25; }
      #mode-switch .mode-desc { font-size: 10px; line-height: 1.3; white-space: nowrap; }
      #mode-switch .mode-option[aria-checked="false"] .mode-desc { color: #7d8598; }
      #mode-switch .mode-option[aria-checked="true"] .mode-desc { color: #e8d9a8; }
      #title-mode .mode-key { color: #8a93a6; font-size: 11px; white-space: nowrap; }
      #title-mode kbd {
        display: inline-block; min-width: 1.3em; padding: 0 4px; margin-right: 3px; text-align: center; box-sizing: border-box;
        border: 1px solid rgba(180, 188, 203, 0.55); border-bottom-width: 2px; border-radius: 3px; color: #e8ecf4; font: inherit; line-height: 1.35;
      }
      @media (prefers-reduced-motion: reduce) {
        #mode-switch .mode-option { transition: none; }
      }
      #hover-label {
        position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none;
        padding: 1px 7px; border-radius: 4px; border: 1px solid #f2f5fa;
        background: rgba(7, 8, 12, 0.85); color: #fff;
        font: 600 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">読み込み中…</div>
    <div id="cluster-location" hidden></div>
    <!-- 画面の上部。左上に作品タイトルとカメラのモード、右上にデータセットの選択欄・UMAP の再計算のパネル・情報パネル（src/app/topLayout.ts） -->
    <div id="top-bar">
      <header id="title-mode">
        <h1 id="app-title">3D UMAP Explorer</h1>
        <div class="mode-row">
          <!-- カメラのモードの 2 択（src/app/modeSwitch.ts）。O キーでも切り替わる -->
          <div id="mode-switch" role="radiogroup" aria-label="カメラのモード" aria-describedby="mode-key-hint">
            <button type="button" role="radio" class="mode-option" data-mode="overview" aria-checked="false" tabindex="-1"><span class="mode-name">俯瞰</span><span class="mode-desc">外から回して眺める</span></button>
            <button type="button" role="radio" class="mode-option" data-mode="fly" aria-checked="true" tabindex="0"><span class="mode-name">飛行</span><span class="mode-desc">中へ入って飛ぶ</span></button>
          </div>
          <span id="mode-key-hint" class="mode-key"><kbd>O</kbd>で切り替え</span>
        </div>
        <div id="mode-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      </header>
      <div id="top-right">
        <div id="dataset-switcher" hidden>
          <label for="dataset-select">データ</label>
          <select id="dataset-select"></select>
          <span id="dataset-status" role="status" aria-live="polite" hidden></span>
          <span id="embedding-status">埋め込み: 事前計算</span>
          <button id="umap-open" type="button" aria-controls="umap-panel" aria-expanded="false" title="UMAP の再計算（U）" disabled>UMAP 再計算 (U)</button>
        </div>
        <div id="top-panels">
          <section id="umap-panel" role="region" aria-labelledby="umap-heading" tabindex="-1" hidden>
            <h2 id="umap-heading">UMAP の再計算</h2>
            <p id="umap-current"></p>
            <form id="umap-form" novalidate>
              <label for="umap-nn">近傍数</label>
              <input id="umap-nn" type="number" inputmode="numeric" step="1" />
              <label for="umap-md">min_dist</label>
              <input id="umap-md" type="number" inputmode="decimal" />
              <label for="umap-seed">乱数の種</label>
              <input id="umap-seed" type="number" inputmode="numeric" step="1" />
              <label class="umap-check"><input id="umap-preview" type="checkbox" /> 計算の途中を表示する</label>
              <div class="umap-buttons">
                <button id="umap-run" type="submit">計算</button>
                <button id="umap-cancel" type="button" hidden>中断</button>
                <button id="umap-revert" type="button">事前計算に戻す</button>
              </div>
            </form>
            <div id="umap-progress" hidden>
              <progress id="umap-progress-bar" max="200" value="0"></progress>
              <span id="umap-progress-text" role="status" aria-live="polite"></span>
            </div>
            <p id="umap-message" role="status" aria-live="polite" hidden></p>
            <div id="umap-cache" hidden>
              <h3>保持している結果</h3>
              <ul id="umap-cache-list"></ul>
            </div>
            <p class="umap-note">点の配置は、近傍数・min_dist・乱数の種で変わります。塊の中の並びは元のデータの近さを反映しますが、遠く離れた塊どうしの位置関係や距離は当てにしないでください。</p>
            <button id="umap-close" type="button" aria-label="UMAP の再計算のパネルを閉じる"><span aria-hidden="true">×</span></button>
          </section>
          <section id="info" role="region" aria-labelledby="info-heading" hidden>
            <h2 id="info-heading" class="sr-only">選択中の点</h2>
            <div class="info-main">
            <canvas id="info-image" width="112" height="112" role="img" aria-label="手書きの数字の画像"></canvas>
            <div>
              <div class="info-label"><span id="info-swatch" aria-hidden="true"></span><span id="info-label"></span></div>
              <dl>
                <dt>番号</dt><dd id="info-index"></dd>
                <dt>クラスタ</dt><dd id="info-cluster"></dd>
              </dl>
              <div class="info-hint">ダブルクリックで近づく<br />Esc で選択を解除</div>
            </div>
            </div>
            <button id="info-close" type="button" aria-label="選択を解除"><span aria-hidden="true">×</span></button>
            <!-- 元のデータで近い点（src/neighbors/）。Tab の順で閉じるボタンのあと -->
            <section id="info-neighbors" aria-labelledby="info-neighbors-heading" hidden>
              <div class="nb-head">
                <h3 id="info-neighbors-heading">元のデータで近い点</h3>
                <span class="nb-legend" aria-hidden="true">●地図で近い点にも入っている ○入っていない</span>
                <button id="info-back" type="button" hidden>← 前の点</button>
              </div>
              <p id="info-neighbors-summary"></p>
              <ol id="info-neighbors-list" aria-label="元のデータで近い順"></ol>
              <p id="info-neighbors-hint"></p>
            </section>
          </section>
        </div>
      </div>
    </div>
    <div id="info-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="info-neighbors-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <!-- 画面の外やカメラの後ろにある、元のデータで近い点の方向を示す印（src/neighbors/）。操作は受けない -->
    <div id="neighbor-edges" aria-hidden="true"></div>
    <div id="hover-label" aria-hidden="true" hidden></div>
    <!-- 目印は Tab の順で情報パネルのあと。見た目の重なりは z-index（HUD・情報パネルより下） -->
    <div id="cluster-labels" role="group" aria-label="クラスタの目印" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
